<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>신발 손상 분석</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root { --orange:#fe7235;--orange-dark:#e85d20;--green:#3e976c;--bar:#ececec;--muted:#7b8794;--err:#cf222e; }
    * { box-sizing:border-box; }
    body { margin:0;background:#f5f7f6;color:#222;font:15px/1.6 "Noto Sans KR","Malgun Gothic",system-ui,sans-serif; }
    button,input { font:inherit; }
    button { cursor:pointer; }
    [hidden] { display:none!important; }
    :focus-visible { outline:2px solid var(--orange);outline-offset:3px; }
    main { width:min(840px,100%);margin:32px auto;background:#fff;padding:64px 24px; }
    h1 { margin:0 0 6px;text-align:center;font-size:clamp(30px,7vw,52px);font-weight:900;line-height:1.2;letter-spacing:-.04em;color:#111; }
    h1 em { font-style:normal;color:var(--orange); }
    .subtitle { text-align:center;margin:0 0 32px;font-size:17px;color:#222; }
    .tool { max-width:640px;margin:0 auto; }
    .connection { display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;margin-bottom:16px;border:1px solid #e5e5e5;border-radius:12px;font-size:13px;color:#555; }
    .btn { padding:9px 16px;border:0;border-radius:8px;background:var(--orange);color:#fff;font-weight:700;white-space:nowrap; }
    .btn:hover { background:var(--orange-dark); }
    .drop { display:grid;place-items:center;text-align:center;min-height:190px;padding:24px;border:2px dashed #ffb89a;border-radius:16px;background:#fff8f4;cursor:pointer;transition:.15s; }
    .drop:hover,.drop.over { border-color:var(--orange);background:#fff1e8; }
    .drop.disabled { opacity:.6; }
    .upload-icon { display:grid;place-items:center;margin:0 auto 10px;width:56px;height:56px;border-radius:50%;background:var(--orange);color:#fff; }
    .upload-icon svg { width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round; }
    .drop strong { display:block;font-size:17px;color:#222; }
    .drop small { color:var(--muted); }
    #resultCard { margin-top:28px;padding-top:24px;border-top:1px solid #eee; }
    #summary { font-size:22px;font-weight:700;color:#222;margin-bottom:2px; }
    #meta { font-size:13px;color:var(--muted);margin-bottom:14px;overflow-wrap:anywhere; }
    #stage { position:relative; }
    #canvas { display:block;width:100%;height:auto;border-radius:12px;background:var(--bar); }
    .spinner { position:absolute;inset:0;display:none;place-items:center;background:rgba(0,0,0,.4);color:#fff;border-radius:12px;font-weight:700;min-height:48px; }
    .busy .spinner { display:grid; }
    #dets { list-style:none;margin:14px 0 0;padding:0;display:grid;gap:4px; }
    #dets li { display:grid;grid-template-columns:12px 110px 1fr 76px;gap:10px;align-items:center;padding:8px 10px;color:#333; }
    .sw { width:12px;height:12px;border-radius:3px; }
    .bar { height:8px;background:var(--bar);border-radius:4px;overflow:hidden; }
    .bar>i { display:block;height:100%;border-radius:4px; }
    .pct { text-align:right;font-weight:700;font-size:13px; }
    .score-note { font-size:12px;color:var(--muted);margin:10px 0 0; }
    dialog { width:min(440px,calc(100% - 32px));border:1px solid #e5e5e5;border-radius:16px;padding:24px;color:#222;box-shadow:0 16px 60px #0002; }
    dialog::backdrop { background:#0005; }
    .dialog-heading { display:flex;align-items:center;justify-content:space-between;margin-bottom:16px; }
    .dialog-heading h2 { margin:0;font-size:20px; }
    #closeServer { border:0;background:none;font-size:26px;line-height:1;padding:4px 8px;color:#777; }
    label { display:block;margin-bottom:6px;font-size:14px; }
    .server-row { display:flex;gap:8px; }
    #api { width:100%;min-width:0;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:14px; }
    #status { margin-top:12px;font-size:13px;overflow-wrap:anywhere; }
    #status.err { color:var(--err); }
    #status.ok { color:var(--green); }
    #status.wait { color:var(--muted); }
    @media(max-width:640px) {
      main { margin:0 auto;padding:44px 20px;min-height:100svh; }
      .subtitle { font-size:15px; }
      .connection { padding:12px; }
      .btn { padding:9px 12px; }
      .drop strong { font-size:15px; }
      #dets li { grid-template-columns:10px 92px 1fr 66px;gap:8px;padding:10px 0; }
      .pct { font-size:12px; }
    }
  </style>
</head>
<body>
  <main id="tool" aria-labelledby="toolTitle">
    <h1 id="toolTitle"><em>신발 손상</em>을 확인해요</h1>
    <p class="subtitle">사진을 올려 직접 분석해 보세요</p>
    <div class="tool">
      <div class="connection">
        <span id="connectionNotice" role="status" aria-live="polite">분석 서버 확인 중…</span>
        <button class="btn" id="openServer" type="button" aria-haspopup="dialog">서버 연결</button>
      </div>
      <div id="drop" class="drop disabled" tabindex="0" role="button" aria-label="사진 선택 또는 끌어다 놓기">
        <div>
          <span class="upload-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0L7 9m5-5 5 5M4 20h16"/></svg></span>
          <strong>사진을 끌어다 놓거나 눌러서 선택</strong>
          <small>jpg · png · webp, 최대 20MB</small>
        </div>
      </div>
      <input id="file" type="file" accept="image/*" hidden>
      <div id="resultCard" hidden>
        <div id="summary" role="status" aria-live="polite"></div>
        <div id="meta"></div>
        <div id="stage"><canvas id="canvas"></canvas><div class="spinner">분석 중…</div></div>
        <ul id="dets"></ul>
        <p class="score-note" id="scoreNote" hidden>막대는 부위별 모델 점수입니다. 판정에는 부위별로 정해진 기준을 적용합니다.</p>
      </div>
    </div>
  </main>
  <dialog id="serverDialog" aria-labelledby="serverTitle">
    <div class="dialog-heading"><h2 id="serverTitle">분석 서버 연결</h2><button id="closeServer" type="button" aria-label="닫기">×</button></div>
    <label for="api">서버 주소</label>
    <div class="server-row"><input id="api" type="url" placeholder="https://…ngrok-free.dev" spellcheck="false" autocomplete="off"><button class="btn" id="connect" type="button">연결</button></div>
    <div id="status" class="wait" role="status" aria-live="polite">실행 중인 분석 서버 주소를 입력해 주세요.</div>
  </dialog>
  <script src="app.js?v=compact1"></script>
</body>
</html>
